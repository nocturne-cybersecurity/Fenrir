[project]
name = "fenrir"
version = "0.1.0"
description = "Framework modular de auditoría ofensiva"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.2",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "colorama>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
fenrir = "fenrir.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fenrir*"]